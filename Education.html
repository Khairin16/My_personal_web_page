<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Education Section</title>

    <!-- Google Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Poppins", sans-serif;
        background: linear-gradient(to right, #eefbff, #9bc8ff);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 30px;
      }

      /* Education Card */
      .education-box {
        width: 90%;
        max-width: 1000px;
        background: rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        padding: 30px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
      }

      /* Title */
      .education-title {
        text-align: center;
        color: rgb(0, 0, 0);
        font-size: 35px;
        margin-bottom: 25px;
        font-weight: 700;
      }

      /* Table */
      table {
        width: 100%;
        border-collapse: collapse;
        overflow: hidden;
        border-radius: 15px;
      }

      th {
        background-color: rgba(94, 193, 255, 0.8);
        color: rgb(0, 0, 0);
        padding: 15px;
        font-size: 18px;
      }

      td {
        background-color: rgb(208, 249, 255);
        color: rgb(0, 0, 0);
        padding: 15px;
        text-align: center;
        font-size: 16px;
        transition: 0.3s;
      }

      tr:hover td {
        background-color: rgba(255, 255, 255, 0.25);
        transform: scale(1.01);
      }

      td,
      th {
        border: 1px solid rgba(255, 255, 255, 0.2);
      }

      /* Responsive */
      @media (max-width: 768px) {
        .education-title {
          font-size: 28px;
        }

        th,
        td {
          font-size: 14px;
          padding: 10px;
        }
      }
    </style>
  </head>

  <body>
    <!-- Education Section -->
    <div class="education-box">
      <h1 class="education-title">🎓 Education Qualification</h1>

      <table>
        <tr>
          <th>Degree</th>
          <th>Institute Name</th>
          <th>Semester</th>
          <th>Session</th>
        </tr>

        <tr>
          <td>Diploma in Engineering</td>
          <td>Bangladesh Sweden Polytechnic Institute</td>
          <td>5th Semester</td>
          <td>2023 - 2024</td>
        </tr>

        <tr>
          <td>SSC</td>
          <td>Sharaf Bhata Union High School</td>
          <td>-</td>
          <td>2020 - 2021</td>
        </tr>
      </table>
    </div>
  </body>
</html>
