<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        background: #94b5f8;
        margin: 0;
        padding: 0;
      }
      .container {
        width: 60%;
        margin: 40px auto;
        background: rgb(185, 207, 227);
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0px 0px 10px rgba(0, 0, 0, 0);
      }
      h2 {
        text-align: center;
        margin-bottom: 20px;
      }
      label {
        font-weight: bold;
        display: block;
        margin-top: 12px;
      }
      input,
      textarea,
      select {
        width: 100%;
        padding: 10px;
        margin-top: 6px;
        border: 1px solid #01000a;
        border-radius: 6px;
        font-size: 15px;
      }
      textarea {
        resize: none;
        height: 100px;
      }
      .gender {
        display: flex;
        gap: 15px;
        margin-top: 8px;
      }
      .gender label {
        font-weight: normal;
        display: flex;
        align-items: center;
        gap: 6px;
        margin: 0;
      }
      button {
        width: 100%;
        margin-top: 20px;
        padding: 12px;
        border: none;
        background: rgb(9, 4, 91);
        color: white;
        font-size: 16px;
        border-radius: 8px;
        cursor: pointer;
      }
      button:hover {
        background: rgb(213, 68, 134);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Contact Form</h2>
      <form>
        <!--Name-->
        <label for="name">Name:</label>
        <input
          type="text"
          id="name"
          name="name"
          placeholder="Enter your name"
          required
        />
        <!--Mobile-->
        <label for="mobile">Mobile:</label>
        <input
          type="tel"
          id="mobile"
          name="mobile"
          placeholder="Enter your mobile number"
          required
        />
        <!--Nationality-->
        <label for="nationality">Nationality:</label>
        <input
          type="text"
          id="nationality"
          name="nationality"
          placeholder="Enter your nationality"
          required
        />
        <!--Gender-->
        <label>Gender:</label>
        <div class="gender">
          <label
            ><input type="radio" name="gender" value="Female" required />
            Female</label
          >
          <label
            ><input type="radio" name="gender" value="Male" required />
            Male</label
          >
          <label
            ><input type="radio" name="gender" value="Other" required />
            Other</label
          >
        </div>
        <!--Address-->
        <label for="address">Address:</label>
        <input
          type="text"
          id="address"
          name="address"
          placeholder="Enter your address"
          required
        />
        <!--Email-->
        <label for="email">Email:</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="Enter your email"
          required
        />
        <!--Message-->
        <label for="message">Message:</label>
        <textarea
          id="message"
          name="message"
          placeholder="Write your message...."
          required
        ></textarea>
        <!--Submit Button-->
        <button type="submit">Submit</button>
      </form>
    </div>
  </body>
</html>
